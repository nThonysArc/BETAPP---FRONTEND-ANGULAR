<mat-toolbar color="primary">
  <button mat-icon-button (click)="volver()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Supervisores</span>
</mat-toolbar>

<div class="contenido">
  <div class="acciones-header">
    <button mat-flat-button color="primary" (click)="abrirNuevoSupervisor()">
      <mat-icon>add</mat-icon>
      Nuevo supervisor
    </button>

    <mat-slide-toggle
      [checked]="mostrarInactivos()"
      (change)="onToggleMostrarInactivos($event.checked)"
    >
      Mostrar inactivos
    </mat-slide-toggle>
  </div>

  @if (cargando()) {
    <app-loading-spinner mensaje="Cargando supervisores..." />
  } @else {
    <table mat-table [dataSource]="supervisores()" class="tabla">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let s">{{ s.nombreCompleto }}</td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let s">
          <mat-chip [color]="s.activo ? 'primary' : undefined" [highlighted]="s.activo">
            {{ s.activo ? 'Activo' : 'Inactivo' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let s">
          <button mat-icon-button (click)="editarSupervisor(s)" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          @if (s.activo) {
            <button mat-icon-button (click)="desactivar(s)" title="Desactivar">
              <mat-icon>block</mat-icon>
            </button>
          } @else {
            <button mat-icon-button (click)="reactivar(s)" title="Reactivar">
              <mat-icon>restart_alt</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>

    @if (supervisores().length === 0) {
      <p class="vacio">Aun no hay supervisores. Crea el primero con "Nuevo supervisor".</p>
    }
  }
</div>
