<div class="login">
  <app-login-marca />

  <section class="cambio-tema" aria-label="Apariencia">
    <app-theme-switch />
  </section>

  <main class="panel">
    <div class="formulario">
      <h2 class="formulario__titulo">Iniciar sesión</h2>
      <p class="formulario__ayuda">Usa el correo y la contraseña de tu cuenta.</p>

      <form
        class="formulario__campos"
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        [attr.aria-busy]="cargando()"
      >
        <div class="campo" [class.campo--error]="invalido('email')">
          <label class="campo__etiqueta" for="login-email">Correo electrónico</label>
          <div class="campo__control">
            <svg class="campo__icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M3 7l9 6 9-6" />
            </svg>
            <input
              id="login-email"
              class="campo__entrada"
              type="email"
              formControlName="email"
              autocomplete="username"
              inputmode="email"
              autocapitalize="none"
              spellcheck="false"
              placeholder="nombre@empresa.com"
              [attr.aria-invalid]="invalido('email')"
              [attr.aria-describedby]="invalido('email') ? 'login-email-error' : null"
            />
          </div>
          @if (invalido('email')) {
            <p class="campo__error" id="login-email-error">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v6M12 16.5v.1" />
              </svg>
              <span>{{ mensajeEmail() }}</span>
            </p>
          }
        </div>

        <div class="campo" [class.campo--error]="invalido('password')">
          <label class="campo__etiqueta" for="login-password">Contraseña</label>
          <div class="campo__control">
            <svg class="campo__icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V8a4 4 0 0 1 8 0v3" />
            </svg>
            <input
              id="login-password"
              class="campo__entrada campo__entrada--clave"
              [type]="mostrarPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              [attr.aria-invalid]="invalido('password')"
              [attr.aria-describedby]="invalido('password') ? 'login-password-error' : null"
            />
            <button
              type="button"
              class="campo__alternar"
              (click)="togglePassword()"
              [attr.aria-pressed]="mostrarPassword()"
              [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                @if (mostrarPassword()) {
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22" />
                } @else {
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                }
              </svg>
              {{ mostrarPassword() ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
          @if (invalido('password')) {
            <p class="campo__error" id="login-password-error">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v6M12 16.5v.1" />
              </svg>
              <span>Ingresa tu contraseña</span>
            </p>
          }
        </div>

        @if (errorMensaje()) {
          <p class="alerta" role="alert">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v6M12 16.5v.1" />
            </svg>
            <span>{{ errorMensaje() }}</span>
          </p>
        }

        <button mat-flat-button class="accion" type="submit" [attr.aria-disabled]="cargando()">
          <span class="accion__contenido">
            @if (cargando()) {
              <mat-spinner diameter="20" />
              <span>Iniciando sesión…</span>
            } @else {
              <span>Iniciar sesión</span>
            }
          </span>
        </button>
      </form>
    </div>
  </main>
</div>
