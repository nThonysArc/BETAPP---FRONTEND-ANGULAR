<mat-toolbar color="primary">
  <button mat-icon-button (click)="volver()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Historial de procesos - {{ nombreCampana() }}</span>
</mat-toolbar>

<div class="contenido">
  @if (cargando()) {
    <app-loading-spinner mensaje="Cargando historial..." />
  } @else {
    <table mat-table [dataSource]="procesos()" class="tabla tabla-apilada tabla-apilada--rejilla">
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let p" data-label="Fecha" data-titulo>{{ p.fecha | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let p" data-label="Estado">
          <mat-chip [color]="p.estado === 'ABIERTO' ? 'primary' : undefined" [highlighted]="p.estado === 'ABIERTO'">
            {{ p.estado }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="totalCortes">
        <th mat-header-cell *matHeaderCellDef>Cortes</th>
        <td mat-cell *matCellDef="let p" data-label="Cortes">{{ p.totalCortes }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let p">
          @if (auth.tiene('REPORTE_VER')) {
            <button mat-icon-button (click)="verAvance(p); $event.stopPropagation()" title="Avance en vivo">
              <mat-icon>monitoring</mat-icon>
            </button>
          }
          <button mat-icon-button (click)="verProceso(p)" title="Ver / Editar">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;" (click)="verProceso(row)" class="fila-clickeable"></tr>
    </table>

    @if (procesos().length === 0) {
      <p class="vacio">Esta campana aun no tiene procesos registrados.</p>
    }
  }
</div>
